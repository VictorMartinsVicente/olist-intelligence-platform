version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: olist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist}
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_pass}
    ports:
      - "5432:5432"
    volumes:
      - olist_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olist_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: python:3.11-slim
    container_name: olist_mlflow
    working_dir: /mlflow
    command: >
      bash -c "pip install --no-cache-dir mlflow psycopg2-binary &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri sqlite:////mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - olist_mlflow_data:/mlflow

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: olist_api
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/model/model.pkl

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: olist_dashboard
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-olist}
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_pass}

volumes:
  olist_pg_data:
  olist_mlflow_data:
