name: Deploy API (Render)

# [Framework] TDSP: Deployment | CRISP-DM: Deployment -- fecha o ciclo de
# CI/CD automatizando o "Manual Deploy" que antes exigia um clique no painel
# do Render a cada push (ver PROCESSO.md e README.md, secao Deploy).

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ml/**"
      - "render.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se RENDER_DEPLOY_HOOK_URL esta configurado
        id: check_secret
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RENDER_DEPLOY_HOOK_URL nao configurado - pulando deploy automatico."
            echo "Configure em: Render Dashboard -> seu servico -> Settings -> Deploy Hook,"
            echo "depois adicione como secret do repositorio (Settings -> Secrets and"
            echo "variables -> Actions -> New repository secret)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar deploy no Render
        if: steps.check_secret.outputs.skip == 'false'
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy disparado no Render."
